<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SzponOS Social Rotator v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#9FEA8A;--screen:#C9F7B8;--outline:#18361C;--dark:#4D8F43}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Pixelify Sans',sans-serif}
.stage{height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:5px}
.bar{width:100%;max-width:520px;min-height:68px;display:flex;align-items:center;gap:12px;padding:9px 13px;border:3px solid var(--outline);border-radius:10px;background:linear-gradient(180deg,var(--screen),var(--brand));box-shadow:inset 0 0 0 2px #ffffff40;color:var(--outline);overflow:hidden}
.icon{flex:0 0 46px;height:46px;display:grid;place-items:center;border-radius:5px;background:var(--outline);color:var(--screen)}
.icon svg{width:30px;height:30px;display:block;fill:currentColor}
.label{min-width:0;flex:1;font-size:clamp(19px,4.4vw,29px);font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.content{display:flex;align-items:center;gap:12px;min-width:0;flex:1;opacity:1;transform:translateY(0);transition:opacity .32s ease,transform .32s ease}
.content.out{opacity:0;transform:translateY(-7px)}
.content.in{opacity:0;transform:translateY(7px)}
</style>
</head>
<body>
<div class="stage"><div class="bar"><div class="content" id="content"><div class="icon" id="icon" aria-hidden="true"></div><div class="label" id="label"></div></div></div></div>
<script>
const DISPLAY_MS=10000;
const TRANSITION_MS=320;
const icons={
 twitch:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.265 3 3 6.236V19h4.5v2.5h2.5l2.5-2.5h3.5L21 14V3H4.265ZM19 13l-4 4h-4l-2.5 2.5V17H5V5h14v8Zm-3-5h-2v5h2V8Zm-5 0H9v5h2V8Z"/></svg>`,
 tiktok:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.1 2.7 1.6 4.24 1.77v4.02c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.78-1.35 3.93-1.31 1.92-3.58 3.17-5.92 3.21-1.44.08-2.89-.31-4.12-1.04C3.15 20.66 1.9 18.39 1.72 16c-.02-.5-.03-1 .02-1.49.18-2.05 1.2-4.02 2.79-5.36 1.81-1.57 4.34-2.32 6.72-1.88.02 1.48-.04 2.95-.04 4.43-1.09-.35-2.34-.25-3.3.4-.69.45-1.22 1.14-1.5 1.91-.23.55-.17 1.15-.16 1.73.26 1.75 1.94 3.12 3.73 2.96 1.18-.01 2.29-.69 2.91-1.67.2-.35.44-.72.45-1.14.1-1.99.06-3.97.07-5.96V.03z"/></svg>`,
 discord:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.73 5.25a18.1 18.1 0 0 0-4.49-1.4l-.55 1.12a16.7 16.7 0 0 0-5.38 0l-.55-1.12a18 18 0 0 0-4.49 1.4C1.43 9.47.65 13.58 1.04 17.63a18.1 18.1 0 0 0 5.51 2.79l1.17-1.91a11.2 11.2 0 0 1-1.84-.89l.45-.34c3.56 1.66 7.78 1.66 11.33 0l.45.34c-.59.35-1.2.65-1.84.89l1.17 1.91a18.2 18.2 0 0 0 5.52-2.79c.47-4.7-.81-8.77-3.23-12.38ZM8.52 15.13c-1.08 0-1.96-.99-1.96-2.2s.86-2.21 1.96-2.21 1.97 1 1.96 2.21c0 1.21-.87 2.2-1.96 2.2Zm6.96 0c-1.08 0-1.96-.99-1.96-2.2s.86-2.21 1.96-2.21 1.97 1 1.96 2.21-.87 2.2-1.96 2.2Z"/></svg>`
};
const ITEMS=[
 {name:'StarySzponciTV',icon:'twitch'},
 {name:'StarySzponciTV',icon:'tiktok'},
 {name:'discord.gg/szpontownia',icon:'discord'}
];
const content=document.getElementById('content');
const iconEl=document.getElementById('icon');
const labelEl=document.getElementById('label');
let current=0;
function render(i){iconEl.innerHTML=icons[ITEMS[i].icon];labelEl.textContent=ITEMS[i].name;}
render(current);
setInterval(()=>{
 content.classList.add('out');
 setTimeout(()=>{
  current=(current+1)%ITEMS.length;
  render(current);
  content.classList.remove('out');
  content.classList.add('in');
  requestAnimationFrame(()=>requestAnimationFrame(()=>content.classList.remove('in')));
 },TRANSITION_MS);
},DISPLAY_MS);
</script>
</body>
</html>
