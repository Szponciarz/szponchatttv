<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SzponOS • Twitch → TikTok v2</title>
<style>
:root{--brand:#9FEA8A;--screen:#C9F7B8;--outline:#18361C;--dark:#4D8F43}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Verdana,Tahoma,sans-serif}
.stage{width:100%;height:100%;padding:5px;display:flex;align-items:center}
.bar{width:100%;height:calc(100% - 2px);min-height:95px;max-height:140px;display:flex;align-items:center;gap:14px;padding:9px 16px;background:linear-gradient(180deg,var(--screen),var(--brand));border:3px solid var(--outline);border-radius:10px;color:var(--outline);box-shadow:inset 0 0 0 2px #ffffff45;position:relative;opacity:0;transform:translateY(8px);transition:opacity .28s,transform .28s;overflow:hidden}
.bar.show{opacity:1;transform:translateY(0)}.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#18361c0a 3px 4px);pointer-events:none}
.platform{flex:none;background:var(--outline);color:var(--screen);border-radius:4px;padding:8px;font-size:20px;font-weight:900}
.content{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;justify-content:center}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:24px;font-weight:900;line-height:1.2}
.viewport{width:100%;overflow:hidden;white-space:nowrap;position:relative}
.message{display:inline-block;position:relative;white-space:nowrap;font-size:26px;line-height:1.3;font-weight:600;transform:translateX(0)}
.message.scroll{animation:marquee var(--scroll-time,7s) linear 1.1s both}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--overflow,0px)))}}
.signal{flex:none;font-weight:800;font-size:18px;white-space:nowrap}
</style></head><body>
<div class="stage"><div class="bar" id="bar"><div class="platform">TTV</div><div class="content"><div class="name" id="name"></div><div class="viewport" id="viewport"><span class="message" id="message"></span></div></div><span class="signal">▂▄▆█</span></div></div>
<script>
// SzponOS v2. Przy anonimowym IRC dostęp zależy od bieżącego wsparcia Twitcha.
const CHANNEL='staryszponcitv';
const BASE_DISPLAY_MS=7000,MAX_DISPLAY_MS=18000,MAX_LENGTH=220;
const BLOCKED=['nightbot','streamelements','moobot','soundalerts'];
const bar=document.getElementById('bar'),nameEl=document.getElementById('name'),messageEl=document.getElementById('message'),viewport=document.getElementById('viewport');
const demo=new URLSearchParams(location.search).has('demo');
let queue=[],busy=false,ws=null,retry=0;
function enqueue(name,message){
  if(!name||!message||BLOCKED.includes(name.toLowerCase())||message.startsWith('!'))return;
  queue.push({name,message:message.replace(/\s+/g,' ').slice(0,MAX_LENGTH)});
  if(queue.length>15)queue.splice(0,queue.length-15);
  if(!busy)next();
}
function next(){
 if(!queue.length){busy=false;return}
 busy=true;
 const item=queue.shift();
 nameEl.textContent=item.name;
 messageEl.classList.remove('scroll');messageEl.style.removeProperty('--scroll-time');messageEl.style.removeProperty('--overflow');
 messageEl.style.transform='translateX(0)';messageEl.textContent=item.message;
 bar.classList.add('show');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const overflow=Math.max(0,Math.ceil(messageEl.scrollWidth-viewport.clientWidth));
   let duration=BASE_DISPLAY_MS;
   if(overflow>3){
     const scrollTime=Math.min(11,Math.max(3,overflow/65));
     duration=Math.min(MAX_DISPLAY_MS,Math.ceil((scrollTime+2.5)*1000));
     messageEl.style.setProperty('--overflow',overflow+'px');
     messageEl.style.setProperty('--scroll-time',scrollTime+'s');
     messageEl.classList.add('scroll');
   }
   setTimeout(()=>{bar.classList.remove('show');setTimeout(next,360)},duration);
 }));
}
function parse(line){
 const i=line.indexOf(' PRIVMSG #');if(i<0)return;
 const trailing=line.indexOf(' :',i);if(trailing<0)return;
 const user=(line.match(/display-name=([^;\s]*)/)||[])[1]||(line.match(/:([^! ]+)!/)||[])[1]||'';
 return {name:user,message:line.slice(trailing+2)};
}
function connect(){
 ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
 ws.onopen=()=>{retry=0;ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(Math.random()*999999));ws.send('JOIN #'+CHANNEL)};
 ws.onmessage=e=>{for(const line of e.data.split('\r\n')){if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');continue}const msg=parse(line);if(msg)enqueue(msg.name,msg.message)}};
 ws.onclose=()=>setTimeout(connect,Math.min(30000,3000*2**Math.min(retry++,4)));
 ws.onerror=()=>ws.close();
}
if(demo){enqueue('Raptus','Siema TikTok! Lecimy na Arenę?');setInterval(()=>enqueue('Szponciak','Pozdrawiam drugą platformę! A to jest specjalna bardzo długa wiadomość testowa, która powinna się płynnie przewinąć na drugiej linii i dać widzowi czas na przeczytanie całego tekstu.'),9500)}else connect();
</script></body></html>
