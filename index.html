<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SzponOS • Twitch → TikTok</title><style>
:root{--brand:#9FEA8A;--screen:#C9F7B8;--outline:#18361C;--dark:#4D8F43}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Verdana,Tahoma,sans-serif}.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:5px}.bar{width:100%;min-height:64px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--screen),var(--brand));border:3px solid var(--outline);border-radius:10px;padding:8px 14px;color:var(--outline);box-shadow:inset 0 0 0 2px #ffffff45;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;position:relative}.bar.show{opacity:1;transform:translateY(0)}.bar:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#18361c0a 3px 4px)}.platform{flex:none;background:var(--outline);color:var(--screen);border-radius:4px;padding:8px;font-size:19px;font-weight:900}.line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:26px;line-height:1.3}.name{font-weight:900}.message{font-weight:600}.signal{margin-left:auto;font-weight:700;font-size:17px;white-space:nowrap}.debug{display:none;position:absolute;bottom:1px;left:15px;font-size:11px;color:#18361caa}
</style></head><body><div class="stage"><div class="bar" id="bar"><div class="platform">TTV</div><div class="line"><span class="name" id="name"> </span><span>: </span><span class="message" id="message"></span></div><span class="signal">▂▄▆█</span><span class="debug" id="debug"></span></div></div><script>
// WERSJA TESTOWA: Odczyt anonimowy IRC; Twitch nie gwarantuje tej metody jako stabilnego API.
const CHANNEL='staryszponcitv';const DISPLAY_MS=7000;const MAX_LENGTH=95;const BLOCKED=['nightbot','streamelements','moobot','soundalerts'];
const bar=document.getElementById('bar'),nameEl=document.getElementById('name'),messageEl=document.getElementById('message'),debugEl=document.getElementById('debug');
const demo=new URLSearchParams(location.search).has('demo');let queue=[],busy=false,ws=null,retry=0;
function enqueue(name,message){if(!name||!message||BLOCKED.includes(name.toLowerCase())||message.startsWith('!'))return;queue.push({name,message:message.replace(/\s+/g,' ').slice(0,MAX_LENGTH)});if(queue.length>12)queue.splice(0,queue.length-12);if(!busy)next()}
function next(){if(!queue.length){busy=false;return}busy=true;const v=queue.shift();nameEl.textContent=v.name;messageEl.textContent=v.message;bar.classList.add('show');setTimeout(()=>{bar.classList.remove('show');setTimeout(next,370)},DISPLAY_MS)}
function parse(line){const i=line.indexOf(' PRIVMSG #');if(i<0)return;const trailing=line.indexOf(' :',i);if(trailing<0)return;const user=(line.match(/display-name=([^;\s]*)/)||[])[1]||(line.match(/:([^! ]+)!/)||[])[1]||'';return{name:user,message:line.slice(trailing+2)}}
function connect(){ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');ws.onopen=()=>{retry=0;ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(Math.random()*999999));ws.send('JOIN #'+CHANNEL)};ws.onmessage=e=>{for(const line of e.data.split('\r\n')){if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');continue}const msg=parse(line);if(msg)enqueue(msg.name,msg.message);if(line.includes('Login authentication failed'))debugEl.textContent='IRC authorization failed'}};ws.onclose=()=>setTimeout(connect,Math.min(30000,3000*2**Math.min(retry++,4)));ws.onerror=()=>ws.close()}
if(demo){enqueue('Raptus','Siema TikTok! Lecimy na Arenę?');setInterval(()=>enqueue('Szponciak','Pozdrawiam drugą platformę!'),10000)}else connect();
</script></body></html>
