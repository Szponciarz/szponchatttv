
<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SzponOS Twitch Chat v4</title>

<style>
@font-face {
  font-family: "Nokja";
  src: url("./NokjaOriginalSmallBold.woff2") format("woff2");
  font-display: swap;
}

:root {
  --brand: #9FEA8A;
  --screen: #C9F7B8;
  --dark: #4D8F43;
  --outline: #18361C;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  font-family: "Nokja", monospace;
}

/* GŁÓWNY KONTENER */
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}

/* RAMKA LCD */
.bar {
  width: 520px;
  max-width: 100%;
  min-height: 95px;
  padding: 14px 18px;

  display: flex;
  align-items: flex-start;
  gap: 14px;

  background: linear-gradient(
    180deg,
    var(--screen),
    var(--brand)
  );

  border: 3px solid var(--outline);
  border-radius: 10px;

  box-shadow:
    inset 0 0 0 2px #ffffff40,
    0 4px 10px #18361c30;

  color: var(--outline);

  opacity: 0;
  transform: translateY(8px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.bar.show {
  opacity: 1;
  transform: translateY(0);
}

/* OZNACZENIE TWITCH */
.platform {
  flex-shrink: 0;
  background: var(--outline);
  color: var(--screen);
  padding: 8px;
  border-radius: 4px;
  font-size: 22px;
  line-height: 1.1;
}

/* WIADOMOŚĆ */
.content {
  flex: 1;
  min-width: 0;
}

.username {
  font-size: 25px;
  line-height: 1.25;
  margin-bottom: 6px;
  overflow-wrap: anywhere;
}

.message {
  font-size: 24px;
  line-height: 1.3;

  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
  line-clamp: 4;
  overflow: hidden;
}
  .username,
.message {
  font-family: "Pixelify Sans", sans-serif;
  font-weight: 700;
}
</style>
</head>

<body>
<div class="stage">
  <div class="bar" id="bar">
    <div class="platform"> <svg viewBox="0 0 24 24" width="32" height="32"
       fill="currentColor" aria-label="Twitch">
    <path d="M4.265 3 3 6.236V19h4.5v2.5h2.5l2.5-2.5h3.5L21 14V3H4.265ZM19 13l-4 4h-4l-2.5 2.5V17H5V5h14v8Zm-3-5h-2v5h2V8Zm-5 0H9v5h2V8Z"/>
  </svg></div>

    <div class="content">
      <div class="username" id="username"></div>
      <div class="message" id="message"></div>
    </div>
  </div>
</div>

<script>
// ==========================
// KONFIGURACJA
// ==========================

const CHANNEL = "staryszponcitv";

const BASE_TIME = 7000;
const MAX_LENGTH = 450;

const BLOCKED = [
  "nightbot",
  "streamelements",
  "moobot",
  "soundalerts"
];

// ==========================
// ELEMENTY
// ==========================

const bar = document.getElementById("bar");
const username = document.getElementById("username");
const message = document.getElementById("message");

const demo = new URLSearchParams(location.search).has("demo");

let queue = [];
let busy = false;
let socket = null;
let retry = 0;

// ==========================
// KOLEJKA WIADOMOŚCI
// ==========================

function enqueue(name, text) {
  if (!name || !text) return;

  if (BLOCKED.includes(name.toLowerCase())) return;
  if (text.startsWith("!")) return;

  queue.push({
    name: name,
    text: text.replace(/\s+/g, " ").slice(0, MAX_LENGTH)
  });

  if (queue.length > 15) {
    queue.shift();
  }

  if (!busy) showNext();
}

// ==========================
// WYŚWIETLANIE
// ==========================

function showNext() {
  if (queue.length === 0) {
    busy = false;
    return;
  }

  busy = true;

  const item = queue.shift();

  username.textContent = item.name;
  message.textContent = item.text;

  // Dłuższe wiadomości zostają dłużej
  const extraTime = Math.max(
    0,
    (item.text.length - 65) * 65
  );

  const displayTime = Math.min(
    30000,
    BASE_TIME + extraTime
  );

  bar.classList.add("show");

  setTimeout(() => {
    bar.classList.remove("show");

    setTimeout(showNext, 350);
  }, displayTime);
}

// ==========================
// TWITCH IRC
// ==========================

function parseMessage(line) {
  const match = line.match(
    /^(?:@([^ ]+) )?:([^! ]+)![^ ]+ PRIVMSG #[^ ]+ :(.+)$/
  );

  if (!match) return null;

  const tags = match[1] || "";
  const fallbackName = match[2];
  const text = match[3];

  const displayTag = tags.match(
    /(?:^|;)display-name=([^;]*)/
  );

  const name = displayTag && displayTag[1]
    ? displayTag[1]
    : fallbackName;

  return { name, text };
}

function connect() {
  socket = new WebSocket(
    "wss://irc-ws.chat.twitch.tv:443"
  );

  socket.onopen = () => {
    retry = 0;

    socket.send(
      "CAP REQ :twitch.tv/tags twitch.tv/commands"
    );

    socket.send("PASS SCHMOOPIIE");

    socket.send(
      "NICK justinfan" +
      Math.floor(Math.random() * 999999)
    );

    socket.send("JOIN #" + CHANNEL);
  };

  socket.onmessage = event => {
    const lines = event.data.split("\r\n");

    for (const line of lines) {
      if (line.startsWith("PING")) {
        socket.send("PONG :tmi.twitch.tv");
        continue;
      }

      const data = parseMessage(line);

      if (data) {
        enqueue(data.name, data.text);
      }
    }
  };

  socket.onclose = () => {
    const wait = Math.min(
      30000,
      3000 * Math.pow(2, Math.min(retry++, 4))
    );

    setTimeout(connect, wait);
  };

  socket.onerror = () => {
    socket.close();
  };
}

// ==========================
// TRYB DEMONSTRACYJNY
// ==========================

if (demo) {
  const samples = [
    ["Raptus", "Siema TikTok!"],
    ["Szponciak", "To jest nieco dłuższa wiadomość, która automatycznie przejdzie do następnego wiersza, gdy zabraknie miejsca na ekranie."],
    ["Hubert", "Pozdrawiam wszystkich widzów na TikToku! Pamiętajcie, że mamy również aktywnego Discorda i wspólne granie z widzami."]
  ];

  let index = 0;

  function addDemo() {
    const sample = samples[index % samples.length];
    enqueue(sample[0], sample[1]);
    index++;
  }

  addDemo();
  setInterval(addDemo, 10000);
} else {
  connect();
}
</script>
</body>
</html>
